commands:
  - dk Stylesheets register NAME --distribution DIST --manifest RESOURCE
  - dk Stylesheets register NAME --distribution DIST --manifest RESOURCE --replace
  - dk Stylesheets list
  - dk Stylesheets show NAME
  - dk Stylesheets validate NAME
  - dk Stylesheets unregister NAME
errors:
  unknown_style: "unknown style '{name}'"
  duplicate_style: "style '{name}' is already registered"
  missing_distribution: "style distribution '{distribution}' is not installed"
  invalid_manifest: "style '{name}' has an invalid manifest"
