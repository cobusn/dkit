commands:
  - dk styles register NAME --distribution DIST --manifest RESOURCE
  - dk styles register NAME --distribution DIST --manifest RESOURCE --replace
  - dk styles list
  - dk styles show NAME
  - dk styles validate NAME
  - dk styles unregister NAME
errors:
  unknown_style: "unknown style '{name}'"
  duplicate_style: "style '{name}' is already registered"
  missing_distribution: "style distribution '{distribution}' is not installed"
  invalid_manifest: "style '{name}' has an invalid manifest"
