[build-system]
requires = ["setuptools", "setuptools-scm", "cython", "cffi>=1.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libdkit"
authors = [
  { name="Cobus Nel"},
]
description = "Data Processing Toolkit"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dynamic = ["dependencies", "version"]

[project.urls]
Homepage = "https://github.com/cobusn/dkit"
Issues = "https://github.com/cobusn/dkit/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# auto-discover instead of a hand-maintained list -- new subpackages (or
# ones removed, e.g. the pending dkit.doc/dkit.plot cleanup) just work.
# namespaces = true: dkit.resources and dkit.resources.templates have no
# __init__.py, so they only get picked up as implicit namespace packages.
include = ["dkit*", "lib_dk*"]
namespaces = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "dkit.__version__"}

[project.scripts]
dk = "lib_dk.dk:main"
